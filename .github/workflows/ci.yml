name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Sync and test
        working-directory: backend
        run: |
          uv sync --extra dev
          uv run pytest -q

  palette-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend deps (OpenAPI palette script)
        working-directory: backend
        run: uv sync --extra dev
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Verify generated palette types match repo
        working-directory: frontend
        run: npm run verify:palette-types
