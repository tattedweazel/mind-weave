[project]
name = "mind-weave-backend"
version = "0.1.0"
description = "Mind Weave API"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "sqlmodel>=0.0.19",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "httpx>=0.27.0",
    "passlib[bcrypt]>=1.7.4",
    "alembic>=1.13.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.22",
    "bcrypt==4.0.1",  # passlib 1.7.x: pin avoids bcrypt 4.1+ API breakage; revisit with passlib upgrade
    "jsonschema>=4.23.0",  # runtime: validate_against_structure (Draft202012Validator)
    "beautifulsoup4>=4.12.0",  # html_parse_basic utility
    "tiktoken>=0.7.0",  # token-count metadata for Documents (GPT-4o tokenizer ``o200k_base``)
]

[project.optional-dependencies]
url-snapshot = [
    "playwright>=1.49.0",  # capture_url_snapshot skill; `uv sync --extra url-snapshot` then `uv run playwright install chromium`
]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "types-passlib>=1.7.7.20260211",
    "types-python-jose>=3.5.0.20250531",
    "types-jsonschema>=4.23.0.20241208",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # line length; optional follow-up with formatter / manual wraps
]
exclude = ["alembic/versions/*.py"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]
# Scripts chdir to backend/ before importing app; imports must follow os.chdir.
"scripts/run_workflow_stream.py" = ["E402"]
"scripts/run_voice_input_workflow_e2e.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
explicit_package_bases = true
warn_unused_configs = true
warn_return_any = true
warn_unreachable = true
strict_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = false

[tool.coverage.report]
skip_covered = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
