[project]
name = "mind-weave-stt-bridge"
version = "0.1.0"
description = "Local HTTP speech-to-text service for Mind Weave (faster-whisper)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.0.0",
    "pydantic-settings>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stt_bridge"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27.0"]
